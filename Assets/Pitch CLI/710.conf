# ============================================================
#  pitch.conf — config pusat pitch.py
#  GANTI LINK PACKAGE DI SINI (kosongkan = pakai FALLBACK/PyPI)
#  Link harus berupa index kompatibel pip, contoh:
#    https://registry.kamu.dev/simple
# ============================================================

# Package manager aktif: ppm | perf | yarn
PACKAGE_MANAGER="ppm"

# Link cadangan (dipakai kalau link manager kosong)
FALLBACK_REGISTRY_URL="https://pypi.org/simple"

# --- PPM (Pitch Package Manager, normal) ---
PPM_REGISTRY_URL="https://raw.githubusercontent.com/ftn-cyber/PitchPY.org/refs/heads/main/Assets/Package%20mirrors/Normal%20hanya%20package"          # <-- ganti link PPM di sini
PPM_USE_FALLBACK=1           # 1 = tetap cari di fallback bila tidak ada

# --- Pitch Performance Manager ---
PERF_REGISTRY_URL="https://raw.githubusercontent.com/ftn-cyber/PitchPY.org/refs/heads/main/Assets/Package%20mirrors/Package%20performance.json"         # <-- ganti link Performance di sini
PERF_USE_FALLBACK=1
PERF_JOBS=0                  # 0 = otomatis sesuai jumlah CPU
PERF_CACHE_DIR="pitchPY.org./assets/package mirrors/package performance.json"

# --- Pitch Yarn ---
YARN_REGISTRY_URL="https://raw.githubusercontent.com/ftn-cyber/PitchPY.org/refs/heads/main/Assets/Package%20mirrors/Yarn.json"         # <-- ganti link Yarn di sini
YARN_USE_FALLBACK=1
YARN_CACHE_DIR="pitchPY.org./assets/package mirrors/yarn.json"

# --- Umum ---
PITCH_PYTHON="python3"
PITCH_VENV=".pitch/venv"

# ============================================================
#  VERSION MANAGER (kelola versi Python, mirip nvm)
# ============================================================
# Version manager aktif: pvm (normal, build dari source) | fast (binary siap pakai)
VERSION_MANAGER="pvm"
PITCH_HOME="${PITCH_HOME:-$HOME/.pitch}"

# --- Pitch Version Manager (pvm) ---
PVM_SOURCE_URL="https://www.python.org/ftp/python"   # <-- ganti link source pvm di sini
PVM_JOBS=2                                           # jumlah job saat compile

# --- Fast Pitch Manager (fast) ---
# Index = JSON release (format GitHub releases API). Ganti ke mirror kamu bila perlu.
FAST_INDEX_URL="https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest"   # <-- ganti link
# Opsional: link langsung ke arsip. Placeholder: {version} {os} {arch} {triple}
# Contoh: "https://mirror.kamu.dev/python-{version}-{triple}.tar.gz" (versi harus lengkap, mis. 3.12.3)
FAST_DOWNLOAD_TEMPLATE=""
FAST_CONNECTIONS=8                                   # koneksi paralel (aria2c)
FAST_INDEX_TTL=3600                                  # detik, cache daftar versi
